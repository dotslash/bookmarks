<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bookmark manager — save, search, and redirect with short URLs.">
    <title>Bookmarks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">B</div>
                <h1>Bookmarks</h1>
            </div>
            <div class="header-right">
                <button class="btn" id="secretBtn" onclick="openSecretModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    Secret
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Add Bookmark
                </button>
            </div>
        </header>

        <!-- Search -->
        <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search bookmarks..." oninput="filterTable()">
            <span class="search-count" id="searchCount"></span>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <div class="status-bar-left">
                <span id="totalCount">0 bookmarks</span>
                <span id="secretStatus" class="secret-badge none">
                    <span class="secret-dot"></span> No secret
                </span>
            </div>
            <button class="btn-ghost btn" onclick="refreshData()" title="Refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                Refresh
            </button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-url" onclick="sortBy('fullurl')">URL <span class="sort-icon">↕</span></th>
                        <th class="col-alias" onclick="sortBy('alias')">Alias <span class="sort-icon">↕</span></th>
                        <th class="col-short">Short URL</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:80%"></div></td><td><div class="skeleton" style="width:60%"></div></td><td><div class="skeleton" style="width:70%"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:65%"></div></td><td><div class="skeleton" style="width:50%"></div></td><td><div class="skeleton" style="width:75%"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90%"></div></td><td><div class="skeleton" style="width:40%"></div></td><td><div class="skeleton" style="width:60%"></div></td><td></td></tr>
                </tbody>
            </table>
        </div>

        <!-- Paginator -->
        <div class="paginator" id="paginator"></div>
    </div>

    <!-- Add Bookmark Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Add Bookmark</h2>
            <label for="addAlias">Alias</label>
            <input type="text" id="addAlias" placeholder="e.g. gh">
            <label for="addUrl">Full URL</label>
            <input type="text" id="addUrl" placeholder="e.g. https://github.com">
            <div class="modal-actions">
                <button class="btn" onclick="closeModal('addModal')">Cancel</button>
                <button class="btn btn-primary" onclick="addBookmark()">Add</button>
            </div>
        </div>
    </div>

    <!-- Secret Modal -->
    <div class="modal-overlay" id="secretModal">
        <div class="modal">
            <h2>Enter Secret</h2>
            <label for="secretInput">Secret Key</label>
            <input type="password" id="secretInput" placeholder="Your admin secret">
            <div class="modal-actions">
                <button class="btn" onclick="clearSecret()">Clear</button>
                <button class="btn btn-primary" onclick="saveSecret()">Save</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2 id="confirmTitle">Are you sure?</h2>
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn btn-danger" id="confirmAction">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
</body>
</html>
